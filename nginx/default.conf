server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/recetapis;
    index index.html;

    # Revalidar el HTML, el manifest, los scripts del worker y los íconos.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location ~ ^/(?:sw\.js|workbox-[^/]+\.js|favicon\.ico)$ {
        try_files $uri =404;
    }

    location ~ ^/(?:icons|images)/ {
        try_files $uri =404;
    }

    # Vite incorpora el hash del contenido en los nombres de JS y CSS.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
