name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, build y PWA
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js y la caché de npm
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Verificar la PWA compilada
        run: node tools/verificar-pwa.mjs
