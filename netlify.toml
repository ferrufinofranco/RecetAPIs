[build]
  publish = "dist"

# Mantener accesibles los archivos estáticos aunque coincidan con el fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Revalidar la interfaz, el manifest y el service worker en el navegador.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
