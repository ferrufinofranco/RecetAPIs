<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/recetapis-32.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#365f40">
    <script>
      // Antes del primer pintado. Mantener clave y valores alineados con useTema.js.
      (() => {
        let preferencia
        try { preferencia = localStorage.getItem('recetapis-tema') } catch { /* Puede estar bloqueado. */ }
        const tema = preferencia === 'claro' || preferencia === 'oscuro'
          ? preferencia : window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        document.documentElement.dataset.tema = tema
        document.querySelector('meta[name="theme-color"]').content = tema === 'oscuro' ? '#151d18' : '#365f40'
      })()
    </script>
    <link rel="stylesheet" href="/src/assets/temas.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="description" content="Explorá el catálogo público de recetas de RecetAPIs.">
    <title>RecetAPIs · Catálogo de recetas</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
